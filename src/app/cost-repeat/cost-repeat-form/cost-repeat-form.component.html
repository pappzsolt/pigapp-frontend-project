<div class="min-h-screen bg-gray-50 p-6 font-sans">

  <div class="max-w-3xl mx-auto">


    <!-- HEADER -->

    <div class="mb-8">

      <h1 class="text-3xl font-bold text-gray-900 tracking-tight">
        Költség ismétlődő tétel
      </h1>

      <p class="text-gray-500 mt-1">
        Új ismétlődő költség rögzítése
      </p>

    </div>



    <!-- FORM CARD -->

    <form
      [formGroup]="costRepeatForm"
      (ngSubmit)="formSubmit.emit()"
      class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 space-y-6"
    >


      <!-- NÉV -->

      <div class="flex flex-col">
        <label for="cost_repeat_name" class="block text-sm font-medium text-gray-700 mb-1">
          Név
        </label>
        <input
          appStyledInput
          id="cost_repeat_name"
          type="text"
          formControlName="cost_repeat_name"
          required
          class="w-full"
        />
      </div>



      <!-- MEGJEGYZÉS -->

      <div class="flex flex-col">
        <label for="cost_repeat_note" class="block text-sm font-medium text-gray-700 mb-1">
          Megjegyzés
        </label>
        <input
          appStyledInput
          id="cost_repeat_note"
          type="text"
          formControlName="cost_repeat_note"
          class="w-full"
        />
      </div>



      <!-- ÖSSZEG -->

      <div class="flex flex-col">
        <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">
          Összeg (Ft)
        </label>
        <input
          appStyledInput
          id="amount"
          type="number"
          formControlName="amount"
          class="w-full"
        />
      </div>



      <!-- KÖLTSÉG DÁTUMA -->

      <div class="flex flex-col">
        <label for="cost_repeat_date" class="block text-sm font-medium text-gray-700 mb-1">
          Költség dátuma
        </label>
        <input
          appStyledInput
          id="cost_repeat_date"
          type="date"
          formControlName="cost_repeat_date"
          required
          class="w-full"
        />
      </div>



      <!-- FIZETVE -->

      <div class="flex flex-col">
        <label for="paid" class="block text-sm font-medium text-gray-700 mb-1">
          Fizetve
        </label>
        <select
          appTailwindStyledSelect
          id="paid"
          formControlName="paid"
          class="w-32"
        >
          <option [value]="1">Igen</option>
          <option [value]="0">Nem</option>
        </select>
      </div>



      <!-- FIZETÉS DÁTUMA -->

      <div class="flex flex-col">
        <label for="paid_date" class="block text-sm font-medium text-gray-700 mb-1">
          Fizetés dátuma
        </label>
        <input
          appStyledInput
          id="paid_date"
          type="date"
          formControlName="paid_date"
          class="w-full"
        />
      </div>



      <!-- LEJÁRATI DÁTUM -->

      <div class="flex flex-col">
        <label for="expire_date" class="block text-sm font-medium text-gray-700 mb-1">
          Lejárati dátum
        </label>
        <input
          appStyledInput
          id="expire_date"
          type="date"
          formControlName="expire_date"
          class="w-full"
        />
      </div>



      <!-- GOMB -->

      <div>
        <button
          type="submit"
          appButton="blue"
          class="w-full rounded-xl"
        >
          {{ isEditMode ? 'Mentés' : 'Létrehozás' }}
        </button>
      </div>


    </form>


  </div>

</div>
