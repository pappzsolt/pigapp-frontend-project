<form
  [formGroup]="cashFlowForm"
  (ngSubmit)="submitForm()"
  class="min-h-screen bg-gray-50 p-6 font-sans"
>

  <div class="max-w-4xl mx-auto">


    <!-- HEADER -->

    <div class="mb-8">

      <h1 class="text-3xl font-bold text-gray-900 tracking-tight">
        Cashflow hozzáadása
      </h1>

      <p class="text-gray-500 mt-1">
        Új cashflow tétel rögzítése
      </p>

    </div>



    <!-- FORM CARD -->

    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">


      <!-- GRID -->

      <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">


        <!-- NÉV -->

        <div>

          <label class="block text-sm font-medium text-gray-700 mb-1">
            Költség neve
          </label>

          <input
            type="text"
            formControlName="cash_flow_name"
            appStyledInput
            class="w-full"
          />

        </div>



        <!-- MEGJEGYZÉS -->

        <div>

          <label class="block text-sm font-medium text-gray-700 mb-1">
            Megjegyzés
          </label>

          <input
            type="text"
            formControlName="cash_flow_note"
            appStyledInput
            class="w-full"
          />

        </div>



        <!-- ÖSSZEG -->

        <div>

          <label class="block text-sm font-medium text-gray-700 mb-1">
            Összeg
          </label>

          <input
            type="number"
            formControlName="amount"
            appStyledInput
            class="w-full"
          />

        </div>



        <!-- DÁTUM -->

        <div>

          <label class="block text-sm font-medium text-gray-700 mb-1">
            Dátum
          </label>

          <input
            appStyledDateInput
            type="date"
            formControlName="cash_flow_date"
            class="w-full"
          />

        </div>



        <!-- PÉNZNEM -->

        <div>

          <label class="block text-sm font-medium text-gray-700 mb-1">
            Pénznem
          </label>

          <select
            formControlName="dev"
            appTailwindStyledSelect
            class="w-full"
          >
            <option *ngFor="let dev of devs" [value]="dev.id">
              {{ dev.dev_name }}
            </option>
          </select>

        </div>



        <!-- SZÁMLA -->

        <div>

          <label class="block text-sm font-medium text-gray-700 mb-1">
            Számla
          </label>

          <select
            formControlName="invoice"
            appTailwindStyledSelect
            class="w-full"
          >
            <option *ngFor="let invoice of invoices" [value]="invoice.id">
              {{ invoice.invoice_name }}
            </option>
          </select>

        </div>



        <!-- CSOPORT -->

        <div>

          <label class="block text-sm font-medium text-gray-700 mb-1">
            Költség csoport
          </label>

          <select
            formControlName="cashflowgroup"
            appTailwindStyledSelect
            class="w-full"
          >
            <option *ngFor="let group of cashFlowGroups" [value]="group.id">
              {{ group.cash_flow_group_name }}
            </option>
          </select>

        </div>


      </div>



      <!-- BUTTON ROW -->

      <div class="mt-8 flex justify-end">


        <button
          appButton="blue"
          type="submit"
        >
          Hozzáadás
        </button>


      </div>


    </div>


  </div>

</form>
