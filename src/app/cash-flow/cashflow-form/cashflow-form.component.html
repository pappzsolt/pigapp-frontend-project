<form
  [formGroup]="cashFlowForm"
  (ngSubmit)="submitForm()"
  class="bg-gray-50 min-h-screen"
>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- PAGE HEADER -->
    <div class="mb-8 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">

      <div>

        <div class="flex items-center gap-3 mb-2">

          <div class="w-11 h-11 rounded-2xl bg-blue-100 flex items-center justify-center shadow-sm">

            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-6 h-6 text-blue-600"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8c-1.657 0-3 1.343-3 3s1.343 3 3 3 3-1.343 3-3-1.343-3-3-3zm0-6v2m0 16v2m8-10h2M2 12H4m12.364 6.364l1.414 1.414M6.222 6.222l1.414 1.414m0 10.728l-1.414 1.414m10.728-10.728l1.414-1.414"
              />
            </svg>

          </div>

          <div>

            <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-gray-900">
              Cashflow hozzáadása
            </h1>

            <p class="text-sm md:text-base text-gray-500 mt-1">
              Új cashflow tétel rögzítése és kezelése
            </p>

          </div>

        </div>

      </div>

      <!-- INFO -->
      <div class="bg-white border border-gray-200 rounded-2xl px-4 py-3 shadow-sm">

        <div class="flex items-center gap-3">

          <div class="w-3 h-3 rounded-full bg-green-500"></div>

          <div>

            <p class="text-xs uppercase tracking-wide text-gray-500 font-medium">
              Állapot
            </p>

            <p class="text-sm font-semibold text-gray-800">
              Új cashflow létrehozása
            </p>

          </div>

        </div>

      </div>

    </div>

    <!-- MAIN CARD -->
    <div class="bg-white border border-gray-200 rounded-3xl shadow-sm overflow-hidden">

      <!-- CARD HEADER -->
      <div class="px-6 md:px-8 py-5 border-b border-gray-100 bg-gradient-to-r from-white to-gray-50">

        <h2 class="text-lg md:text-xl font-semibold text-gray-900">
          Cashflow adatok
        </h2>

        <p class="text-sm text-gray-500 mt-1">
          Töltsd ki az alábbi mezőket
        </p>

      </div>

      <!-- FORM CONTENT -->
      <div class="p-6 md:p-8">

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 items-start">

          <!-- NÉV -->
          <div class="flex flex-col gap-2 min-w-0">

            <label class="text-sm font-semibold text-gray-700">
              Költség neve
            </label>

            <input
              type="text"
              formControlName="cash_flow_name"
              appStyledInput
              class="w-full h-11"
              placeholder="Pl. Rezsi, előfizetés..."
            />

          </div>

          <!-- MEGJEGYZÉS -->
          <div class="flex flex-col gap-2 min-w-0">

            <label class="text-sm font-semibold text-gray-700">
              Megjegyzés
            </label>

            <input
              type="text"
              formControlName="cash_flow_note"
              appStyledInput
              class="w-full h-11"
              placeholder="Kiegészítő információ..."
            />

          </div>

          <!-- ÖSSZEG -->
          <div class="flex flex-col gap-2 min-w-0">

            <label class="text-sm font-semibold text-gray-700">
              Összeg
            </label>

            <div class="relative w-full">

              <input
                type="number"
                formControlName="amount"
                appStyledInput
                class="w-full h-11 pr-14"
                placeholder="0"
              />

              <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-medium text-gray-400">
                Ft
              </span>

            </div>

          </div>

          <!-- DÁTUM -->
          <div class="flex flex-col gap-2 min-w-0">

            <label class="text-sm font-semibold text-gray-700">
              Dátum
            </label>

            <input
              appStyledDateInput
              type="date"
              formControlName="cash_flow_date"
              class="w-full h-11"
            />

          </div>

          <!-- PÉNZNEM -->
          <div class="flex flex-col gap-2 min-w-0">

            <label class="text-sm font-semibold text-gray-700">
              Pénznem
            </label>

            <div class="relative w-full">

              <select
                formControlName="dev"
                appTailwindStyledSelect
                class="w-full h-11 min-h-[44px] appearance-none pr-10"
              >

                <option *ngFor="let dev of devs" [value]="dev.id">
                  {{ dev.dev_name }}
                </option>

              </select>

              <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-400">

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>

              </div>

            </div>

          </div>

          <!-- SZÁMLA -->
          <div class="flex flex-col gap-2 min-w-0">

            <label class="text-sm font-semibold text-gray-700">
              Számla
            </label>

            <div class="relative w-full">

              <select
                formControlName="invoice"
                appTailwindStyledSelect
                class="w-full h-11 min-h-[44px] appearance-none pr-10"
              >

                <option *ngFor="let invoice of invoices" [value]="invoice.id">
                  {{ invoice.invoice_name }}
                </option>

              </select>

              <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-400">

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>

              </div>

            </div>

          </div>

          <!-- CSOPORT -->
          <div class="flex flex-col gap-2 min-w-0">

            <label class="text-sm font-semibold text-gray-700">
              Költség csoport
            </label>

            <div class="relative w-full">

              <select
                formControlName="cashflowgroup"
                appTailwindStyledSelect
                class="w-full h-11 min-h-[44px] appearance-none pr-10"
              >

                <option *ngFor="let group of cashFlowGroups" [value]="group.id">
                  {{ group.cash_flow_group_name }}
                </option>

              </select>

              <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-400">

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>

              </div>

            </div>

          </div>

        </div>

      </div>

      <!-- FOOTER -->
      <div class="sticky bottom-0 bg-white border-t border-gray-100 px-6 md:px-8 py-4">

        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">

          <div class="text-sm text-gray-500">
            Ellenőrizd az adatokat mentés előtt.
          </div>

          <div class="flex items-center gap-3">

            <button
              type="button"
              class="px-5 py-2.5 rounded-xl border border-gray-200 text-gray-700 font-medium hover:bg-gray-50 transition"
            >
              Mégse
            </button>

            <button
              appButton="blue"
              type="submit"
              class="min-w-[160px]"
            >
              Cashflow mentése
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</form>
