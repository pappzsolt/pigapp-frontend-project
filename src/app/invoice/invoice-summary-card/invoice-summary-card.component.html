<div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">

  <!-- FEJLÉC -->
  <header class="flex items-start justify-between gap-4 px-4 md:px-5 py-4 border-b border-gray-100 bg-gradient-to-r from-white to-gray-50">

    <div class="min-w-0">

      <p class="text-xs uppercase tracking-wide text-gray-500 font-medium">
        Számla neve
      </p>

      <h3 class="text-base md:text-lg font-semibold text-gray-900 truncate">
        {{ summary.invoice_name }}
      </h3>

    </div>

    <div class="text-right shrink-0">

      <p class="text-xs uppercase tracking-wide text-gray-500 font-medium">
        Fizetendő összeg
      </p>

      <p class="text-lg md:text-2xl font-bold text-green-600">
        {{ summary.total_invoice_amount | number }} Ft
      </p>

    </div>

  </header>

  <!-- TÁBLÁZAT -->
  <div class="overflow-x-auto">

    <table
      appTailwindStyledTable
      class="w-full text-sm"
    >

      <thead class="bg-gray-50 border-b border-gray-100">

      <tr>

        <th class="w-14 px-4 py-3 text-left text-xs font-semibold tracking-wide text-gray-500 uppercase">
          #
        </th>

        <th class="px-4 py-3 text-left text-xs font-semibold tracking-wide text-gray-500 uppercase">
          Költségnév
        </th>

        <th class="px-4 py-3 text-right text-xs font-semibold tracking-wide text-gray-500 uppercase">
          Összeg
        </th>

      </tr>

      </thead>

      <tbody class="divide-y divide-gray-100">

      <tr
        *ngFor="let detail of summary.details; let i = index"
        class="hover:bg-gray-50 transition-colors duration-150"
      >

        <td class="px-4 py-3 text-gray-500 font-medium">
          {{ i + 1 }}
        </td>

        <td class="px-4 py-3 text-gray-800 font-medium">
          {{ detail.costrepeat_name }}
        </td>

        <td class="px-4 py-3 text-right font-semibold text-gray-900 whitespace-nowrap">
          {{ detail.total_amount | number }} Ft
        </td>

      </tr>

      </tbody>

    </table>

  </div>

</div>
