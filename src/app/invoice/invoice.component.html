<div class="min-h-screen bg-gray-50 p-6 font-sans">

  <div class="max-w-3xl mx-auto bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-6">

    <!-- FEJLÉC -->

    <div>
      <p class="text-sm text-gray-500">ID: {{ invoice.id }}</p>
      <h3>
        <input
          [value]="invoice.invoice_name"
          type="text"
          [(ngModel)]="invoice.invoice_name"
          id="invoice_name"
          required
          class="mt-1 block w-full rounded-2xl border border-gray-300 shadow-sm px-3 py-2
                 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition"
        />
      </h3>
    </div>



    <!-- FELHASZNÁLÓ -->

    <div class="grid grid-cols-3 items-center gap-4">
      <label class="font-medium text-gray-700">Felhasználó:</label>
      <div class="col-span-2 text-gray-900">{{ invoice.user }}</div>
    </div>



    <!-- LEÍRÁS -->

    <div class="grid grid-cols-3 items-center gap-4">
      <label for="invoice_note" class="font-medium text-gray-700">Leírás</label>
      <input
        [value]="invoice.invoice_note"
        type="text"
        [(ngModel)]="invoice.invoice_note"
        id="invoice_note"
        placeholder="Számla leírása"
        required
        class="col-span-2 block w-full rounded-2xl border border-gray-300 shadow-sm px-3 py-2
               focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition"
      />
    </div>



    <!-- ÖSSZEG -->

    <div class="grid grid-cols-3 items-center gap-4">
      <label for="amount" class="font-medium text-gray-700">Összeg</label>
      <div class="col-span-2 flex items-center gap-2">
        <input
          type="number"
          id="amount"
          name="amount"
          [(ngModel)]="invoice.amount"
          value="{{ invoice.amount }}"
          min="1"
          step="1"
          required
          pattern="\d+"
          title="Kérlek, adj meg egy pozitív egész számot!"
          class="block w-full rounded-2xl border border-gray-300 shadow-sm px-3 py-2
                 focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition"
        />
        <span class="text-gray-600">Ft</span>
      </div>
    </div>



    <!-- STÁTUSZ -->

    <div class="grid grid-cols-3 items-center gap-4">
      <label for="enableInvoice" class="font-medium text-gray-700">Státusz</label>
      <div class="col-span-2 flex items-center gap-2">
        <input
          id="enableInvoice"
          type="checkbox"
          [(ngModel)]="invoice.enable_invoice"
          class="h-5 w-5 text-green-600 rounded focus:ring-2 focus:ring-green-400 transition"
        />
        <span
          [ngClass]="{
            'text-green-600': invoice.enable_invoice,
            'text-red-600': !invoice.enable_invoice
          }"
          class="font-medium"
        >
          {{ invoice.enable_invoice ? 'Aktív számla' : 'Inaktív számla' }}
        </span>
      </div>
    </div>



    <!-- LÉTREHOZVA -->

    <div class="grid grid-cols-3 items-center gap-4">
      <span class="font-medium text-gray-700">Létrehozva</span>
      <span class="col-span-2 text-gray-900">{{ invoice.create_invoice_date | date:'yyyy-MM-dd' }}</span>
    </div>



    <!-- GOMB -->

    <div class="flex justify-end">
      <button
        appButton="blue"
        class="px-4 py-2 rounded-2xl font-semibold shadow hover:shadow-md transition"
        (click)="onSaveClicked()"
      >
        Mentés
      </button>
    </div>

  </div>

</div>
