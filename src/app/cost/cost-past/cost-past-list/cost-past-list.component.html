<div class="p-6 space-y-6 bg-gray-50 min-h-screen">

  <!-- Loading -->
  <div *ngIf="loading" class="text-center text-gray-500">Betöltés...</div>

  <!-- Error -->
  <div *ngIf="error" class="text-red-500 font-semibold">{{ error }}</div>

  <!-- Cost cards -->
  <div *ngFor="let cost of costs"
       class="relative rounded-2xl p-6 border shadow-sm hover:shadow-md transition-all duration-200"
       [ngClass]="isSelected(cost)
          ? 'bg-blue-50 border-blue-200 ring-2 ring-blue-300'
          : 'bg-white border-gray-200'">

    <!-- Bal oldali szín sáv -->
    <div class="absolute left-0 top-0 h-full w-1 rounded-l-2xl transition-colors duration-300"
         [ngClass]="isSelected(cost) ? 'bg-blue-500' : 'bg-gray-200'">
    </div>

    <!-- Felső sor: modern toggle -->
    <div class="flex items-center justify-between mb-4">

      <div class="flex items-center space-x-3">

        <!-- Toggle -->
        <label class="relative inline-flex items-center cursor-pointer">
          <input
            type="checkbox"
            class="sr-only peer"
            [checked]="isSelected(cost)"
            (change)="toggleSelection(cost)" />

          <!-- Toggle háttér -->
          <div class="w-11 h-6 bg-gray-300 rounded-full
                      peer-checked:bg-blue-500
                      transition-colors duration-300">
          </div>

          <!-- Toggle gomb -->
          <div class="absolute left-1 top-1
                      w-4 h-4 bg-white rounded-full shadow
                      transition-transform duration-300
                      peer-checked:translate-x-5">
          </div>
        </label>

        <span class="text-sm font-medium transition-colors duration-200"
              [ngClass]="isSelected(cost) ? 'text-blue-700' : 'text-gray-600'">
          Másolás következő hónapra
        </span>

      </div>

      <div class="text-sm font-semibold text-gray-500">
        ID: {{ cost.id }}
      </div>
    </div>

    <!-- Grid mezők -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

      <div>
        <label class="form-label">Név</label>
        <input type="text" [(ngModel)]="cost.cost_name" class="form-input" />
      </div>

      <div>
        <label class="form-label">Megjegyzés</label>
        <input type="text" [(ngModel)]="cost.cost_note" class="form-input" />
      </div>

      <div>
        <label class="form-label">Összeg (Ft)</label>
        <input type="number" [(ngModel)]="cost.amount" class="form-input" />
      </div>

      <div>
        <label class="form-label">Költség dátuma</label>
        <input type="date" [(ngModel)]="cost.cost_date" class="form-input" />
      </div>

      <div class="flex items-center space-x-3 pt-6">
        <input type="checkbox" [(ngModel)]="cost.paid"
               class="h-5 w-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
        <label class="text-sm font-medium text-gray-700">Fizetve</label>
      </div>

      <div>
        <label class="form-label">Fizetés dátuma</label>
        <input type="date" [(ngModel)]="cost.paid_date" class="form-input" />
      </div>

      <div>
        <label class="form-label">Létrehozva</label>
        <input type="text" [value]="cost.create_cost_date" disabled
               class="mt-1 block w-full border-gray-200 bg-gray-100 rounded-xl px-3 py-2 text-sm" />
      </div>

    </div>

    <!-- Gombok -->
    <div class="flex justify-end space-x-3 mt-6">
      <button (click)="saveCost(cost)"
              class="px-5 py-2.5 bg-blue-500 text-white rounded-xl shadow hover:bg-blue-600 transition">
        Mentés
      </button>

      <button (click)="deleteCost(cost.id)"
              class="px-5 py-2.5 bg-red-500 text-white rounded-xl shadow hover:bg-red-600 transition">
        Törlés
      </button>
    </div>

  </div>

  <!-- Másolás gomb -->
  <div class="flex justify-end">
    <button (click)="createNextMonthCosts()"
            class="px-6 py-3 bg-green-500 text-white rounded-2xl shadow-lg hover:bg-green-600 transition font-semibold">
      Kiválasztott costok másolása következő hónapra
    </button>
  </div>

  <!-- Nincs adat -->
  <div *ngIf="!loading && costs.length === 0"
       class="text-gray-500 text-center py-10">
    Nincs előző hónap költség.
  </div>

  <!-- Sticky bottom total -->
  <div class="sticky bottom-0 bg-white/90 backdrop-blur border-t border-gray-200 p-4 flex justify-end font-semibold text-lg">
    Összesen: {{ totalAmount | number }} Ft
  </div>

</div>
