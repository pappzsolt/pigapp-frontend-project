<div class="min-h-screen bg-gray-50 p-6 font-sans">

  <div class="max-w-3xl mx-auto">


    <!-- HEADER -->

    <div class="mb-8">

      <h1 class="text-3xl font-bold text-gray-900 tracking-tight">
        Költség hozzáadása
      </h1>

      <p class="text-gray-500 mt-1">
        Új költség tétel rögzítése
      </p>

    </div>



    <!-- FORM CARD -->

    <form
      [formGroup]="costForm"
      (ngSubmit)="onSubmit()"
      class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8 space-y-6"
    >


      <ng-container *ngFor="let field of fields">


        <!-- INPUT + SELECT -->

        <div *ngIf="field.type !== 'checkbox'">


          <label
            [for]="field.name"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            {{ field.label }}
          </label>



          <!-- INPUT -->

          <input
            *ngIf="field.type !== 'select'"
            [id]="field.name"
            [formControlName]="field.name"
            [type]="field.type"
            appStyledInput
            [disabled]="field.name === 'paid_date' && costForm.get('paid')?.value === false"
            class="w-full"
          />



          <!-- SELECT -->

          <select
            *ngIf="field.type === 'select'"
            [id]="field.name"
            [formControlName]="field.name"
            appTailwindStyledSelect
            class="w-full"
            [ngClass]="{
              'w-5/6': field.name === 'costrepeat',
              'w-32': field.name !== 'costrepeat'
            }"
          >

            <option value="" disabled>
              -- Válasszon --
            </option>

            <option
              *ngFor="let item of getOptions(field.listName!)"
              [value]="item.id"
            >
              {{ getDisplayName(field, item) }}
            </option>

          </select>


        </div>



        <!-- CHECKBOX -->

        <div
          *ngIf="field.type === 'checkbox'"
          class="flex items-center gap-3 pt-2"
        >

          <input
            [id]="field.name"
            type="checkbox"
            [formControlName]="field.name"
            class="w-5 h-5 rounded-md border-gray-300
                   text-blue-600 focus:ring-blue-500"
          />

          <label
            [for]="field.name"
            class="text-gray-700 font-medium"
          >
            {{ field.label }}
          </label>

        </div>


      </ng-container>



      <!-- BUTTON -->

      <div class="pt-4">

        <button
          type="submit"
          appButton="blue"
          class="w-full rounded-xl"
        >
          Hozzáadás
        </button>

      </div>


    </form>


  </div>


</div>
