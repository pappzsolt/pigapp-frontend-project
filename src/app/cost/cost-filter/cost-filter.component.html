<div class="min-h-screen bg-gray-50 p-6 font-sans">

  <div class="max-w-xl mx-auto">


    <!-- HEADER -->

    <div class="mb-8">

      <h1 class="text-3xl font-bold text-gray-900 tracking-tight">
        Költség dátum szűrés
      </h1>

      <p class="text-gray-500 mt-1">
        Szűrés költségek dátuma alapján
      </p>

    </div>



    <!-- FILTER CARD -->

    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">


      <form
        (ngSubmit)="onFilter()"
        class="space-y-6"
      >


        <!-- DÁTUM -->

        <div>

          <label class="block text-sm font-medium text-gray-700 mb-1">
            Dátum
          </label>

          <input
            type="date"
            [(ngModel)]="searchDate"
            name="date"
            required
            appStyledDateInput
            class="w-full"
          />

        </div>



        <!-- BUTTON -->

        <div class="pt-2">

          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl transition"
          >
            Keresés
          </button>

        </div>


      </form>


    </div>


  </div>


</div>
